services:
  postgres:
    image: postgres:17
    container_name: financehub-postgres

    environment:
      POSTGRES_USER: financehub
      POSTGRES_PASSWORD: financehub_dev
      POSTGRES_DB: financehub

    ports:
      - "5432:5432"

    volumes:
      - financehub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financehub -d financehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financehub_postgres_data: